
name: y3d-creations

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-y3d}
      MYSQL_USER: ${DB_USER:-y3d_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db_net

  db-sync:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-y3d}
      DB_USER: ${DB_USER:-y3d_user}
    volumes:
      - ./database/database.sql:/database.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        M="mysql -h db -u$$DB_USER $$DB_NAME --default-character-set=utf8mb4"
        NOVO=$$(sha256sum /database.sql | cut -d" " -f1)
        $$M -e "CREATE TABLE IF NOT EXISTS catalogo_versao (id TINYINT PRIMARY KEY, hash CHAR(64) NOT NULL, aplicado_em TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP)"
        ANTIGO=$$($$M -N -B -e "SELECT hash FROM catalogo_versao WHERE id = 1")
        if [ "$$NOVO" = "$$ANTIGO" ]; then echo 'Banco já atualizado.'; exit 0; fi
        $$M < /database.sql
        $$M -e "REPLACE INTO catalogo_versao (id, hash) VALUES (1, '$$NOVO')"
        echo 'Banco atualizado.'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-y3d}
      DB_USER: ${DB_USER:-y3d_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-7200}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      Y3D_BASE_URL: ${Y3D_BASE_URL:-}
      Y3D_EMAIL_FROM: ${Y3D_EMAIL_FROM:-y3dsuporte@gmail.com}
      Y3D_SMTP_HOST: ${Y3D_SMTP_HOST:-smtp.gmail.com}
      Y3D_SMTP_PORT: ${Y3D_SMTP_PORT:-587}
      Y3D_SMTP_ENCRYPTION: ${Y3D_SMTP_ENCRYPTION:-tls}
      Y3D_SMTP_USER: ${Y3D_SMTP_USER:-y3dsuporte@gmail.com}
      Y3D_SMTP_PASSWORD: ${Y3D_SMTP_PASSWORD:-}
    volumes:
      - ./data:/app/data:ro
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    networks:
      app_net: {}
      db_net: {}
      public_net:
        gw_priority: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - public_net
      - app_net

networks:
  public_net:
    internal: false

  app_net:
    internal: true

  db_net:
    internal: true

volumes:
  db_data:
