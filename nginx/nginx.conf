# Nginx = único ponto de entrada do projeto (é o único serviço com porta aberta).
# Ele recebe o acesso do navegador e encaminha para o serviço certo dentro do Docker:
#
#   /api/*        → backend   (API Express)
#   /loja-php/*   → loja      (site em PHP)
#   todo o resto  → frontend  (React)

upstream frontend_app {
  server frontend:80;
}

upstream backend_api {
  server backend:3000;
}

upstream loja_app {
  server loja:80;
}

server {
  listen 80;
  server_name _;

  # /api/* → backend (Express)
  location /api/ {
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Produtos compartilhados: usa a cópia canônica da loja PHP e mantém
  # fallback para imagens que existem apenas no frontend React.
  location ^~ /img/produtos/ {
    proxy_intercept_errors on;
    error_page 404 = @frontend_product_images;
    proxy_pass http://loja_app/assets/img/produtos/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @frontend_product_images {
    proxy_pass http://frontend_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # /loja-php → /loja-php/
  location = /loja-php {
    return 301 /loja-php/;
  }

  # /loja-php/* → loja em PHP (o prefixo /loja-php/ é tirado antes de entregar ao Apache)
  location ^~ /loja-php/ {
    # contas (hashes de senha) e código interno nunca podem ser baixados pelo navegador
    location ~ ^/loja-php/(data|includes)/ {
      return 404;
    }

    proxy_pass http://loja_app/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /loja-php;
  }

  # todo o resto → frontend (React)
  location / {
    proxy_pass http://frontend_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
