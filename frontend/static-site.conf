# Nginx interno do frontend: entrega os arquivos compilados do React.
# Quem recebe o acesso de fora e distribui para os serviços é o nginx/nginx.conf (na raiz do projeto).

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Qualquer rota do React (ex.: /loja, /login) volta para o index.html,
  # e o React Router mostra a tela certa.
  location / {
    try_files $uri /index.html;
  }
}
